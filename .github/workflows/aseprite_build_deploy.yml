name: Build and deploy Aseprite
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Version
        id: get_version
        shell: pwsh
        run: |
          $repo = "aseprite/aseprite"
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest"
          $tag = $releases.tag_name
          echo "LATEST_TAG=$tag" >> $env:GITHUB_ENV
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        shell: powershell
        run: |
          choco install cmake ninja
          pip install dmgbuild

      - name: Download Source
        shell: pwsh
        run: |
          git clone --recursive --branch ${{ env.LATEST_TAG }} https://github.com/aseprite/aseprite.git aseprite

      - name: Build Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd aseprite
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=C:/deps/skia -DSKIA_LIBRARY_DIR=C:/deps/skia/out/Release-x64 ..
          ninja aseprite

      - name: Package and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          files: |
            aseprite/build/bin/aseprite.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
